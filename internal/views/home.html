<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World-Ranks</title>

  <link rel="icon" href="/static/images/logo.svg">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/static/css/global.css">
  <link rel="stylesheet" href="/static/css/home.css">
</head>


<style>
</style>

<body>

  <header class="header">
    <div class="header__content">
      <img src="/static/images/hero-image.jpg" />

      <img class="logo" src="/static/images/logo.svg" />
    </div>
  </header>

  <main>
    <div class="content">
      <section class="search-container">
        <h2 class="title">Found 234 countries</h2>

        <input class="search" id="search" value="{{ .Search }}" type="search" name="search"
          placeholder="Search by Name or Region" aria-label="Search" />
      </section>

      <div class="test">
        <section class="filters">
          <div>
            <div>
              <label for="sort">Sort</label>
              <select class="sort" id="sort" name="sort" aria-label="Sort by" required value="">
                <option selected disabled value="">
                  Sort by
                </option>
                <option value="population" {{if eq .Sort "population" }}selected{{end}}>Population</option>
                <option value="name" {{if eq .Sort "name" }}selected{{end}}>Name</option>
                <option value="area" {{if eq .Sort "area" }}selected{{end}}>Area</option>
              </select>

            </div>
          </div>


          <div>
            <fieldset>
              <legend>Region</legend>

              <input type="checkbox" id="americas" name="region" value="americas" {{if
                .SelectedRegions.americas}}checked{{end}} />
              <label for="americas">Americas</label>

              <input type="checkbox" id="africa" name="region" value="africa" {{if
                .SelectedRegions.africa}}checked{{end}} />
              <label for="africa">Africa</label>

              <input type="checkbox" id="asia" name="region" value="asia" {{if .SelectedRegions.asia}}checked{{end}} />
              <label for="asia">Asia</label>

              <input type="checkbox" id="europe" name="region" value="europe" {{if
                .SelectedRegions.europe}}checked{{end}} />
              <label for="europe">Europe</label>

              <input type="checkbox" id="antarctic" name="region" value="antarctic" {{if
                .SelectedRegions.antarctic}}checked{{end}} />
              <label for="antarctic">Antarctic</label>
            </fieldset>
          </div>

          <div>
            <fieldset>
              <legend>Status</legend>
              <label>
                <input type="radio" name="status" value="member_un" {{if eq .Status "member_un" }}checked{{end}} />
                Member of the United Nations
              </label>
              <label>
                <input type="radio" name="status" value="independent" {{if eq .Status "independent" }}checked{{end}} />
                Independent
              </label>
            </fieldset>
          </div>
        </section>

        <section class="countries">
          <table>
            <thead>
              <tr>
                <th>Flag</th>
                <th>Name</th>
                <th>Population</th>
                <th>Area (km2)</th>
                <th>Region</th>
              </tr>
            </thead>
            <tbody>
              {{ range .Countries}}
              <tr>
                <td>
                  <img class="flag" src={{.Flags.Svg}} />
                </td>
                <td><a href="/details/{{ .Code }}">{{.Name.Common}}</a></td>
                <td>{{formatInt .Population}}</td>
                <td>{{formatFloat .Area}}</td>
                <td>{{.Region}}</td>
              </tr>
              {{end}}
            </tbody>
          </table>
        </section>
      </div>
    </div>
  </main>

  <script src="/static/js/main.js" type="text/javascript"></script>
</body>

</html>
